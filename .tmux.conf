# Core settings — safe across macOS, Linux, and Windows (psmux)
set -g focus-events on
set -g mouse on
set -g history-limit 100000

# Lets apps (e.g. Claude Code) tell Shift+Enter apart from plain Enter
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Visual-only activity monitoring (no audible bell)
set -g monitor-activity on
set -g visual-activity off
set -g bell-action any

# Machine/OS-specific overrides (e.g. native notification hooks) — not tracked here
source-file -q ~/.tmux.conf.local
